[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgtrack"
version = "0.1.0"
description = "Overhead-camera tracking of physical Magic: The Gathering games with automatic play detection and an AI opponent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crocofied" }]
keywords = ["magic-the-gathering", "computer-vision", "opencv", "forge", "card-recognition"]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "requests>=2.28",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
gui = ["opencv-python>=4.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
mtgtrack = "mtgtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtgtrack = ["ui/static/*", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
