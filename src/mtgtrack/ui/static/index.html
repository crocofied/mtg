<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtgtrack</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d26; --panel-2:#21252f; --line:#2c313d;
    --text:#e6e8ee; --muted:#8b93a7; --accent:#6ea8fe; --good:#4ec9a0;
    --warn:#e0a458; --bad:#e06c75; --land:#5ac47e; --tapped:#e0a458;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:18px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .pill { background:var(--panel-2); border:1px solid var(--line); border-radius:999px;
          padding:3px 11px; font-size:12px; white-space:nowrap; }
  .pill b { color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns: 1.15fr 1fr; gap:14px; padding:14px; align-items:start; }
  @media (max-width:1000px){ .grid{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel > h2 { margin:0; padding:9px 13px; font-size:11px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); }
  .panel > div { padding:11px 13px; }
  .zone { margin-bottom:13px; }
  .zone:last-child { margin-bottom:0; }
  .zone h3 { margin:0 0 6px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
             color:var(--muted); display:flex; justify-content:space-between; }
  .cards { display:flex; flex-wrap:wrap; gap:6px; min-height:26px; }
  .card { background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
          padding:4px 9px; font-size:13px; display:flex; align-items:center; gap:7px; }
  .card.tapped { border-color:var(--tapped); color:var(--tapped); }
  .card.castable { border-color:var(--good); box-shadow:0 0 0 1px rgba(78,201,160,.25) inset; }
  .card.land { border-left:3px solid var(--land); }
  .card .cost { color:var(--muted); font-size:11px; }
  .empty { color:var(--muted); font-style:italic; font-size:12px; }
  #log { max-height:330px; overflow-y:auto; font-size:12.5px; }
  #log div { padding:3px 0; border-bottom:1px solid rgba(255,255,255,.04); display:flex; gap:8px; }
  #log .t { color:var(--muted); min-width:38px; }
  #log .turn-begin { color:var(--accent); font-weight:600; }
  #log .opponent-action { color:var(--warn); }
  #log .state-desync { color:var(--bad); }
  #log .draw { color:var(--good); }
  #view { width:100%; display:block; background:#000; border-radius:6px; }
  button { background:var(--panel-2); color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mana { display:flex; gap:6px; flex-wrap:wrap; }
  .sym { width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
         font-size:12px; font-weight:700; color:#12141a; }
  .W{background:#f5f0da}.U{background:#8fc7e8}.B{background:#a9a29c}
  .R{background:#e79a86}.G{background:#a4d0a8}.C{background:#c9c9c9}
  .bar { height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-top:5px; }
  .bar i { display:block; height:100%; background:var(--good); }
  .offline { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>mtgtrack</h1>
  <span class="pill">Zug <b id="turn">–</b></span>
  <span class="pill">Phase <b id="phase">–</b></span>
  <span class="pill">Bibliothek <b id="library">–</b></span>
  <span id="seat-pills" class="row" style="gap:6px"></span>
  <span class="pill" id="vision">–</span>
  <span class="pill" id="opponent-engine">–</span>
  <span style="flex:1"></span>
  <div class="row">
    <button onclick="post('/api/turn/next')">Zug beenden</button>
    <button onclick="post('/api/turn/round')" id="btn-round">KIs ziehen lassen</button>
    <button onclick="post('/api/game/restart')">Neues Spiel</button>
  </div>
</header>

<div class="grid">
  <div>
    <div class="panel" style="margin-bottom:14px">
      <h2>Kameraansicht</h2>
      <div><img id="view" alt="Mattenansicht"></div>
    </div>
    <div class="panel">
      <h2>Deine Zonen</h2>
      <div id="zones"></div>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:14px">
      <h2>Mana</h2>
      <div>
        <div class="row" style="justify-content:space-between">
          <div class="mana" id="mana-symbols"></div>
          <div><b id="mana-total">0</b> <span class="empty">verfügbar</span></div>
        </div>
        <div class="bar"><i id="mana-bar" style="width:0%"></i></div>
        <div style="margin-top:9px" class="empty" id="castable-label">Spielbar aus der Hand</div>
        <div class="cards" id="castable"></div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <h2>Gegner</h2>
      <div id="opponent-board"><span class="empty">noch nichts passiert</span></div>
    </div>
    <div class="panel">
      <h2>Verlauf</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const ZONE_LABELS = {
  hand:"Hand", lands:"Länder", battlefield:"Schlachtfeld",
  graveyard:"Friedhof", exile:"Exil", stack:"Stapel", command:"Kommandozone"
};
const ZONE_ORDER = ["hand","command","lands","battlefield","stack","graveyard","exile"];
let castable = new Set();

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text; return e; }

function cardChip(card){
  const isLand = (card.type_line||"").toLowerCase().includes("land");
  const chip = el("div","card"+(card.tapped?" tapped":"")+(isLand?" land":"")
    +(castable.has(card.name)?" castable":""));
  chip.appendChild(el("span",null,card.name));
  if(card.mana_cost) chip.appendChild(el("span","cost",card.mana_cost));
  if(card.tapped) chip.appendChild(el("span","cost","↻"));
  chip.title = (card.type_line||"") + (card.confidence!==undefined?`  ·  Erkennung ${Math.round(card.confidence*100)}%`:"");
  return chip;
}

function renderZones(player){
  const host = document.getElementById("zones");
  host.innerHTML = "";
  for(const zone of ZONE_ORDER){
    const cards = (player.zones && player.zones[zone]) || [];
    const unknown = (player.unknown_in_zone||{})[zone] || 0;
    if(!cards.length && !unknown && zone!=="hand" && zone!=="lands" && zone!=="battlefield") continue;
    const box = el("div","zone");
    const head = el("h3");
    head.appendChild(el("span",null,ZONE_LABELS[zone]||zone));
    head.appendChild(el("span",null,String(cards.length + unknown)));
    box.appendChild(head);
    const list = el("div","cards");
    cards.forEach(c => list.appendChild(cardChip(c)));
    for(let i=0;i<unknown;i++) list.appendChild(el("div","card","unbekannt"));
    if(!cards.length && !unknown) list.appendChild(el("span","empty","leer"));
    box.appendChild(list);
    host.appendChild(box);
  }
}

function renderMana(mana){
  const host = document.getElementById("mana-symbols");
  host.innerHTML = "";
  const colours = mana.by_colour || {};
  for(const [sym,count] of Object.entries(colours)){
    for(let i=0;i<count;i++) host.appendChild(el("div","sym "+sym,sym));
  }
  if(!Object.keys(colours).length) host.appendChild(el("span","empty","keine ungetappten Manaquellen"));
  document.getElementById("mana-total").textContent = mana.total ?? 0;
  document.getElementById("mana-bar").style.width = Math.min(100,(mana.total||0)*10)+"%";
}

function renderLog(events){
  const host = document.getElementById("log");
  host.innerHTML = "";
  events.slice().reverse().forEach(e=>{
    const row = el("div", e.type);
    const t = new Date(e.timestamp*1000);
    row.appendChild(el("span","t", t.toTimeString().slice(0,5)));
    row.appendChild(el("span",null, describe(e)));
    host.appendChild(row);
  });
}

function describe(e){
  const who = e.owner==="player" ? "Du" : "Gegner";
  const n = e.card_name || "eine Karte";
  switch(e.type){
    case "draw": return `${who}: ${n} gezogen`;
    case "land_played": return `${who}: ${n} gespielt`;
    case "spell_cast": return `${who}: ${n} gewirkt ${e.detail?.mana_cost||""}`;
    case "permanent_entered": return `${n} kommt ins Spiel`;
    case "died": return `${n} → Friedhof`;
    case "discarded": return `${who}: ${n} abgeworfen`;
    case "exiled": return `${n} → Exil`;
    case "returned_to_hand": return `${n} → Hand`;
    case "tapped": return `${n} getappt`;
    case "untapped": return `${n} enttappt`;
    case "turn_begin": return `——— Zug ${e.turn} (${e.detail?.name || who}) ———`;
    case "attack_declared": return `${who} greift an mit ${(e.detail?.attackers||[]).join(", ")}`;
    case "mana_available": return `Mana: ${e.detail?.pool||""}`;
    case "opponent_action": return `${e.detail?.name || "Gegner"}: ${e.detail?.text||""}`;
    case "state_desync": return `⚠ ${n}: ${e.detail?.seen}× gesehen, ${e.detail?.in_deck}× im Deck`;
    case "game_start": return "Spiel gestartet";
    case "life_changed": return `${who}: ${e.detail?.life} Leben`;
    default: return `${e.type} ${n}`;
  }
}

function renderSeats(state){
  const host = document.getElementById("seat-pills");
  host.innerHTML = "";
  (state.seats || []).forEach(seat => {
    const pill = el("span", "pill" + (seat.lost ? " offline" : ""));
    const active = seat.seat === state.active_seat ? "▶ " : "";
    pill.appendChild(el("span", null, active + shortName(seat)));
    pill.appendChild(el("b", null, " " + seat.life));
    if(seat.commander) pill.title = "Kommandeur: " + seat.commander;
    if(seat.lost) pill.title = "ausgeschieden";
    host.appendChild(pill);
  });
}

function shortName(seat){
  if(seat.seat === 0) return "Du";
  const name = seat.name || ("KI " + seat.seat);
  return name.length > 18 ? name.slice(0, 17) + "…" : name;
}

function renderOpponentBoards(state){
  const board = document.getElementById("opponent-board");
  board.innerHTML = "";
  (state.seats || []).filter(s => s.seat !== 0).forEach(seat => {
    const head = el("h3");
    head.appendChild(el("span", null, shortName(seat) + (seat.lost ? " (raus)" : "")));
    head.appendChild(el("span", null, `${seat.life} Leben`));
    const box = el("div", "zone");
    box.appendChild(head);
    let any = false;
    ["battlefield","lands","command","graveyard"].forEach(zone => {
      const cards = (seat.zones || {})[zone] || [];
      if(!cards.length) return;
      any = true;
      const list = el("div","cards");
      list.appendChild(el("span","empty", ZONE_LABELS[zone] + ":"));
      cards.forEach(c => list.appendChild(cardChip(c)));
      box.appendChild(list);
    });
    if(!any) box.appendChild(el("span","empty","leeres Board"));
    board.appendChild(box);
  });
  if(!board.children.length) board.appendChild(el("span","empty","kein Gegner"));
}

function apply(data){
  if(!data || !data.state) return;
  const s = data.state;
  document.getElementById("turn").textContent = s.turn;
  document.getElementById("phase").textContent = s.phase;
  document.getElementById("library").textContent = s.player.library_count;
  renderSeats(s);
  const round = document.getElementById("btn-round");
  if(round) round.textContent = (s.seats||[]).length > 2 ? "KIs ziehen lassen" : "Gegner ziehen lassen";

  const v = data.vision || {};
  document.getElementById("vision").innerHTML =
    `Sicht <b>${v.identified||0}/${v.cards_seen||0}</b>` + (v.stable===false?" · Bewegung":"");
  const o = data.opponent || {};
  const eng = document.getElementById("opponent-engine");
  const count = (data.opponents||[]).length;
  eng.innerHTML = `Gegner <b>${o.engine||"–"}</b>` + (count>1?` ×${count}`:"")
    + ((data.opponents||[]).some(x=>x.fallback)?" (Fallback)":"");
  eng.classList.toggle("offline", (data.opponents||[]).some(x=>x.connected===false && !x.fallback));

  castable = new Set(data.castable||[]);
  renderZones(s.player);
  renderMana(data.mana||{});

  const cast = document.getElementById("castable");
  cast.innerHTML = "";
  (data.castable||[]).forEach(name => cast.appendChild(cardChip({name, castable:true})));
  if(!(data.castable||[]).length) cast.appendChild(el("span","empty","nichts bezahlbar"));

  renderOpponentBoards(s);
  renderLog(data.events||[]);
}

async function post(url){
  const res = await fetch(url,{method:"POST"});
  if(res.ok) apply(await res.json());
}

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => apply(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 1500);
  setInterval(()=>{ if(ws.readyState===1) ws.send("ping"); }, 20000);
}

function refreshView(){
  const img = document.getElementById("view");
  img.src = "/api/frame.jpg?t=" + Date.now();
}

fetch("/api/state").then(r=>r.json()).then(apply).catch(()=>{});
connect();
setInterval(refreshView, 700);
refreshView();
</script>
</body>
</html>
